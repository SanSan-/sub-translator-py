schema: spec-driven

context: |
  Продукт: локальный переводчик ASS/SRT/WebVTT через явно выбранные профили.
  Стек: CPython 3.14, uv/pyproject+uv.lock, CLI и FastAPI; модельные среды изолированы.
  Первый файл: openspec/context/00-start-here.md; остальные документы по его маршруту.
  Нормы только в OpenSpec; при конфликте описания с проверенным кодом приоритет у кода.
  Общий профиль: openspec/specs/engineering-governance/reference/python-common.md.
  Проектные команды и ограничения: reference/project-specific.md той же capability.
  Сохраняй пользовательские данные и секреты. Структурный PASS не доказывает runtime.

  Автоматические правила работы: project-context CTX-005…008 и engineering-governance SEC-CONTEXT-001…004.
  Методика CTX-009 применяется только по отдельному явному запросу на аудит.
rules:
  proposal:
    - Укажи цель пользователя, Scope, Non-goals и точные capability.
  specs:
    - Сохраняй Requirement, SHALL/MUST, Scenario и WHEN/THEN; формы EARS уточняют условия.
    - Приводи ключевой успех, границу и отказ с наблюдаемым результатом; не выдумывай решения.
  design:
    - Свяжи сценарий с существующим компонентом, проверкой и доказательством; используй профильные ADR.
    - Сохраняй решения, гипотезы и следующий шаг длительной задачи раздельно.
  tasks:
    - Не расширяй задачу; отдельный PASS не закрывает невыполненные обязательные проверки.
    - Документальные проверки отделяй от тестов приложения, моделей, сети и выпуска.
    - Сохраняй событийную сводку и точный следующий шаг; tasks остаётся единственной очередью.
