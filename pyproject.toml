[build-system]
requires = ["setuptools==84.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sub-translate"
dynamic = ["version"]
description = "Console subtitle translator for ASS/SRT/VTT."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "accelerate==1.14.0",
  "bitsandbytes==0.50.0",
  "fastapi==0.141.1",
  "filelock==3.29.0",
  "hf-xet==1.6.0",
  "huggingface-hub==1.27.0",
  "openai==2.53.0",
  "protobuf==7.35.1",
  "psutil==7.2.2",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "tokenizers==0.22.2",
  "torch==2.13.0+cu130",
  "transformers==5.14.1",
  "uvicorn==0.52.1",
]

[dependency-groups]
dev = [
  "build==1.5.0",
  "coverage==7.15.4",
  "httpx==0.28.1",
  "httpx2==2.10.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
  "sacrebleu==2.6.0",
  "wheel==0.47.0",
]

[project.scripts]
sub-translate = "sub_translate.cli:main"
sub-translate-web = "sub_translate.web.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "sub_translate.__version__" }

[tool.uv]
environments = [
  "implementation_name == 'cpython' and sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
  "implementation_name == 'cpython' and sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["sub_translate*"]

[tool.setuptools.package-data]
"sub_translate.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: тяжёлые проверки с реальной локальной моделью или внешним API",
]

[tool.coverage.run]
branch = true
source = ["sub_translate"]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_empty = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py314"
line-length = 119

[tool.ruff.lint]
select = ["B", "C4", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
ignore = ["RUF001", "RUF002", "RUF003"]
